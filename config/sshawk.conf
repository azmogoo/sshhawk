# sshawk config (cli can override)

# default source: authlog | journalctl | file
DEFAULT_SOURCE="file"

# sample log for local tests
DEFAULT_SAMPLE_FILE="samples/sample-auth.log"

# top N ips in report
DEFAULT_TOP=10

# report format: text | markdown
DEFAULT_FORMAT="markdown"

# geo api (no key needed)
GEO_API_URL="http://ip-api.com/json"

# delay between api calls (sec)
GEO_DELAY=1

# report output dir (relative to project root)
REPORT_DIR="reports"

# journalctl units to try
JOURNAL_UNITS="ssh sshd"
